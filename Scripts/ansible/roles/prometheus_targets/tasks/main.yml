---
- name: Generate node_exporter target list from the monitored group
  ansible.builtin.template:
    src: node_exporters.yml.j2
    dest: /etc/prometheus/targets/node_exporters.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  # Prometheus's file_sd_configs has refresh_interval: 30s in
  # prometheus.yml, so it picks this up on its own - no restart needed.
